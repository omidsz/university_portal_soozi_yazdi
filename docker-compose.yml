version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: university_portal
    command: gunicorn --bind 0.0.0.0:8000 core.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker
    command: celery -A university_portal worker --l INFO -P INFO
    volumes:
      - .:/app